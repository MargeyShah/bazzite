---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# GNOME desktop, NVIDIA (open kernel modules).
name: bazzite-gnome-nvidia-open
description: MargeyShah personal Bazzite image (GNOME desktop, NVIDIA open).
base-image: ghcr.io/ublue-os/bazzite-gnome-nvidia-open
image-version: stable

# Flatpak-first; podman-docker is the single rpm exception. See bazzite-gnome.yml.
modules:
  - type: rpm-ostree
    install:
      - podman-docker

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - im.riot.Riot          # Element
          - com.visualstudio.code # Visual Studio Code
          - org.signal.Signal            # Signal Desktop
          - dev.vencord.Vesktop            # Vesktop (Discord)
          - com.plexamp.Plexamp            # Plexamp
          - sh.ppy.osu                     # osu! (lazer)
          - com.github.mtkennerly.ludusavi # Ludusavi (save backups)
          - com.heroicgameslauncher.hgl    # Heroic Games Launcher
          - it.mijorus.gearlever           # Gear Lever (AppImage manager)
          - org.prismlauncher.PrismLauncher # Prism Launcher (Minecraft)
          - info.cemu.Cemu                 # Cemu (Wii U)
          - net.rpcs3.RPCS3                # RPCS3 (PS3)
          - org.DolphinEmu.dolphin-emu     # Dolphin (GameCube/Wii)
          - dev.goats.xivlauncher          # XIVLauncher (FFXIV)
      - scope: user

  - type: files
    files:
      - source: system
        destination: /

  - type: signing
