---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# HTPC/handheld (gamescope + GNOME), NVIDIA.
name: bazzite-deck-nvidia-gnome
description: MargeyShah personal Bazzite image (deck + GNOME, HTPC, NVIDIA).
base-image: ghcr.io/ublue-os/bazzite-deck-nvidia-gnome
image-version: stable

# Flatpak-first; podman-docker is the single rpm exception. See bazzite-gnome.yml.
modules:
  - type: rpm-ostree
    install:
      - podman-docker

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - im.riot.Riot          # Element
          - com.visualstudio.code # Visual Studio Code
      - scope: user

  - type: files
    files:
      - source: system
        destination: /

  - type: signing
