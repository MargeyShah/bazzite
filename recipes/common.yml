---
# Shared module set for every Bazzite variant. Imported by each recipe in
# recipes/ via `- from-file: common.yml`.
#
# Policy: FLATPAK-FIRST on the host. GUI apps ship as system flatpaks; the host
# is never modified with dnf/copr. `podman-docker` is the single, deliberate rpm
# exception (a small compat shim so the `docker` CLI targets Podman; Bazzite
# ships Podman, not Docker).

# podman-docker shim so `docker` works against Podman. Layer-only exception.
- type: rpm-ostree
  install:
    - podman-docker

# Host GUI apps as system flatpaks (Flathub). Mirrors DESKTOP_FLATPAKS in
# setup/fresh_install_bazzite.sh so the image and the bootstrap agree.
- type: default-flatpaks
  configurations:
    - notify: true
      scope: system
      install:
        - im.riot.Riot          # Element
        - com.visualstudio.code # Visual Studio Code
    - scope: user # Flathub user repo, no user packages forced

# Static files copied into the image root (files/system/* -> /).
- type: files
  files:
    - source: system
      destination: /

# Sets up the signing policy so the signed image verifies.
- type: signing
